<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trope Utilities</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; }
    body { font-family: Arial, sans-serif; background: #BEE3F4; }
    #splash-screen {
      position: fixed; inset: 0; width: 100vw; height: 100vh;
      background-color: #BEE3F4; display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 99999;
      transition: opacity 2s ease;
    }
    #splash-screen.fade-out { opacity: 0; }
    #splash-screen img {
      width: 70vw; height: 65vh; object-fit: contain; flex-shrink: 1;
    }
    .splash-title {
      font-family: "Lucida Calligraphy", cursive; font-weight: bold;
      font-size: 37px; letter-spacing: 2px; color: darkred; text-align: center;
      position: absolute; top: 25%; left: 50%; transform: translateX(-50%);
      width: 90%; margin: 0; z-index: 2;
    }
  </style>
  <script src="utilities.js" defer></script>
</head>
<body>
  <div id="splash-screen">
    <h2 class="splash-title">From the workshop of I_Sokie Enterprises</h2>
    <img src="ISokieButton.svg" alt="I_Sokie Enterprises">
  </div>
</body>
</html>
