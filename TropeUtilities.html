<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trope Utilities</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 32px;
      background: #f7f7f7;
      color: #222;
    }
    .utilities-panel {
      max-width: 760px;
      margin: 30px auto;
      background: white;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 24px 28px 30px;
    }
    h1 { margin: 0 0 24px; }
    .utility-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .utility-button {
      width: 100%;
      text-align: left;
      padding: 12px 16px;
      border: 1px solid #aaa;
      border-radius: 5px;
      background: royalblue;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .utility-button:hover { background: navy; }
    #status {
      min-height: 22px;
      margin-top: 20px;
      font-weight: bold;
      color: #555;
    }
  </style>
</head>
<body>
  <main class="utilities-panel">
    <h1>Trope Utilities</h1>

    <div class="utility-list">
      <button id="mergeTropeFilesBtn" class="utility-button" type="button">
        Merge Trope Files
      </button>
    </div>

    <div id="status" aria-live="polite"></div>
  </main>

  <script>
    document.getElementById("mergeTropeFilesBtn").addEventListener("click", () => {
      document.getElementById("status").textContent = "Not Implemented";
    });
  </script>
</body>
</html>
